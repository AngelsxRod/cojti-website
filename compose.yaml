services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: cojti
      MARIADB_USER: cojti
      MARIADB_PASSWORD: ${COJTI_DB_PASSWORD:?Set COJTI_DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - '127.0.0.1:${COJTI_MARIADB_PORT:-3306}:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: mysql://cojti:${COJTI_DB_PASSWORD:?Set COJTI_DB_PASSWORD in .env}@db:3306/cojti
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    expose:
      - '3000'
    environment:
      DATABASE_URL: mysql://cojti:${COJTI_DB_PASSWORD:?Set COJTI_DB_PASSWORD in .env}@db:3306/cojti
      LINKS_WRITE_API_KEY: ${LINKS_WRITE_API_KEY:?Set LINKS_WRITE_API_KEY in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      API_URL: http://api:3000
      DATABASE_URL: mysql://cojti:${COJTI_DB_PASSWORD:?Set COJTI_DB_PASSWORD in .env}@db:3306/cojti
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
    ports:
      - '${COJTI_WEB_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
